name: PSI Swarm CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: psi-swarm-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/saas-maker/.github/workflows/psi-swarm-ci.yml@a5ac1608c11117ad5561ccc1c77d2b272141b373

  code-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pip install lizard==1.23.0
      - run: pnpm run format:check
      - run: pnpm run quality:lint
      - run: pnpm run build
        working-directory: cli
      - run: pnpm run build
        working-directory: web
      - run: pnpm run test:coverage
        working-directory: cli
      - run: pnpm run test
        working-directory: web
      - run: pnpm run quality:unused
      - run: pnpm run quality:complexity
      - run: pnpm run quality:duplication
      - run: pnpm run quality:cycles
      - run: pnpm run quality:dependencies
      - run: pnpm run quality:suppressions
      - run: pnpm run docs:check
